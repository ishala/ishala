runtime: python39  # Menggunakan runtime Python 3.9 untuk melayani file statis

handlers:
  # Menangani akses ke halaman utama
  - url: /
    static_files: index.html
    upload: index.html

  # Menangani akses ke file CSS
  - url: /css/(.*)
    static_files: css/\1
    upload: css/(.*)

  # Menangani akses ke file JavaScript
  - url: /js/(.*)
    static_files: js/\1
    upload: js/(.*)

  # Menangani akses ke file font
  - url: /fonts/(.*)
    static_files: fonts/\1
    upload: fonts/(.*)

  # Menangani akses ke file ikon
  - url: /icons/(.*)
    static_files: icons/\1
    upload: icons/(.*)

  # Menangani akses ke gambar
  - url: /images/(.*)
    static_files: images/\1
    upload: images/(.*)

  # Menangani favicon (opsional)
  - url: /favicon.ico
    static_files: images/favicon.ico
    upload: images/favicon.ico